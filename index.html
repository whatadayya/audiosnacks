<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>有聲下酒菜 — WHAT a DAY</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* =============================================
       品牌識別色彩系統 — 什麼好日子 2026.05.04
       ============================================= */
    :root {
      --black:   #000000;
      --white:   #ffffff;
      --silver:  #aaaaaa; /* 核心形象主色 */

      /* Accent Palette — 故事系列色號 */
      --cherry:  #FFCADE;  /* F6111 屋內日子 */
      --tea:      #94b671;  /* F6103 繁瑣日子 */
      --chestnut:#713f2c;  /* F6138 家庭系列 */
      --mustard: #b59b24;  /* F6128 回憶系列 */
      --blue:    #1d418e;  /* F6155 調色日子 */
      --plum:    #572936;  /* F6104 深夜系列 */

      --bg-main:    var(--silver);
      --text-main:  var(--black);
      --text-sub:   rgba(0, 0, 0, 0.6);
      --border-thin: rgba(0, 0, 0, 0.2);
      --accent:     var(--black);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Noto Sans TC', sans-serif;
      overflow: hidden;
    }

    /* 品牌微幅砂礫紙質調 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.65;
    }

    /* 頂部故事系列動態指示細線 */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      z-index: 998;
      transition: background 0.6s ease;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* =============================================
       HEADER — 頂部標準識別排版
       ============================================= */
    .header {
      padding: 36px 40px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-mark {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    /* 左側主商標 */
    .brand-logo-img {
      height: 44px;  
      width: auto;
      display: block;
      object-fit: contain;
      flex-shrink: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--text-sub);
      text-align: right;
      line-height: 1.5;
    }

    /* 右上角官方獨立圖標 */
    .brand-icon-img {
      height: 28px;
      width: auto;
      display: block;
      object-fit: contain;
      flex-shrink: 0;
    }

    /* =============================================
       MAIN & VIEWFINER (景觀窗元素容器)
       ============================================= */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 40px;
    }

    .viewfinder-window {
      position: relative;
      width: 100%;
      max-width: 380px;
      padding: 44px 32px;
      background: rgba(255, 255, 255, 0.15); 
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 觀景窗四角定位線 */
    .viewfinder-corners::before,
    .viewfinder-corners::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--text-main);
      pointer-events: none;
    }
    .viewfinder-corners::before { top: 14px; left: 14px; border-top: 1px solid; border-left: 1px solid; }
    .viewfinder-corners::after { top: 14px; right: 14px; border-top: 1px solid; border-right: 1px solid; }
    
    .viewfinder-window::before,
    .viewfinder-window::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--text-main);
      pointer-events: none;
    }
    .viewfinder-window::before { bottom: 14px; left: 14px; border-bottom: 1px solid; border-left: 1px solid; }
    .viewfinder-window::after { bottom: 14px; right: 14px; border-bottom: 1px solid; border-right: 1px solid; }

    /* =============================================
       BEFORE STATE — 盲盒抽取前
       ============================================= */
    .state-before {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }
    
    /* 盲盒中央大型核心圖標 */
    .blind-box-img {
      height: 56px;
      width: auto;
      margin-bottom: 36px;
      display: block;
      object-fit: contain;
    }

    .before-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 18px;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 0.06em;
      line-height: 1.7;
      margin-bottom: 12px;
    }
    .before-sub {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.9;
      font-weight: 400;
      margin-bottom: 36px;
      max-width: 250px;
    }

    .play-btn-large {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1px solid var(--text-main);
      background: var(--text-main);
      color: var(--bg-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .play-btn-large:hover {
      transform: scale(1.04);
      background: transparent;
      color: var(--text-main);
    }
    .play-hint {
      font-family: 'DM Mono', monospace;
      font-size: 8.5px;
      letter-spacing: 0.2em;
      color: var(--text-sub);
      margin-top: 16px;
    }

    /* =============================================
       PLAYING STATE — 故事抽取後
       ============================================= */
    .state-playing {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 44px;
      margin-bottom: 32px;
    }
    .wave-bar {
      width: 2px;
      background: var(--text-main);
      border-radius: 1px;
      animation: wave 1.3s ease-in-out infinite;
    }
    .wave-bar:nth-child(1)  { height: 8px;  animation-delay: 0s; }
    .wave-bar:nth-child(2)  { height: 22px; animation-delay: 0.1s; }
    .wave-bar:nth-child(3)  { height: 34px; animation-delay: 0.22s; }
    .wave-bar:nth-child(4)  { height: 42px; animation-delay: 0.14s; }
    .wave-bar:nth-child(5)  { height: 48px; animation-delay: 0.06s; }
    .wave-bar:nth-child(6)  { height: 38px; animation-delay: 0.26s; }
    .wave-bar:nth-child(7)  { height: 28px; animation-delay: 0.1s; }
    .wave-bar:nth-child(8)  { height: 44px; animation-delay: 0.18s; }
    .wave-bar:nth-child(9)  { height: 32px; animation-delay: 0.32s; }
    .wave-bar:nth-child(10) { height: 20px; animation-delay: 0.04s; }
    .wave-bar:nth-child(11) { height: 36px; animation-delay: 0.16s; }
    .wave-bar:nth-child(12) { height: 24px; animation-delay: 0.22s; }
    .wave-bar:nth-child(13) { height: 42px; animation-delay: 0.08s; }
    .wave-bar:nth-child(14) { height: 18px; animation-delay: 0.2s; }
    .wave-bar:nth-child(15) { height: 10px; animation-delay: 0.28s; }
    .wave-bar.paused { animation-play-state: paused; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.3); opacity: 0.4; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    .series-chip-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border: 1px solid var(--text-main);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--text-main);
      margin-bottom: 22px;
      background: rgba(0,0,0,0.02);
      font-weight: 400;
    }
    .series-chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-main);
    }

    .story-title-wrap {
      margin-bottom: 24px;
      width: 100%;
    }
    .story-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 21px;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 0.04em;
      line-height: 1.5;
    }

    .story-meta {
      font-family: 'DM Mono', monospace;
      font-size: 9.5px;
      color: var(--text-sub);
      letter-spacing: 0.08em;
    }

    .progress-wrap {
      width: 100%;
      margin-top: 16px;
    }
    .progress-bar {
      width: 100%;
      height: 2px;
      background: rgba(0, 0, 0, 0.08);
      position: relative;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      background: var(--text-main);
      width: 0%;
      position: relative;
    }
    .progress-fill::after {
      content: '';
      position: absolute;
      right: -1px;
      top: -4px;
      width: 2px;
      height: 10px;
      background: var(--text-main);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: var(--text-sub);
    }

    /* 控制面板 — 只保留置中的核心播放鈕 */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      width: 100%;
    }
    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-sub);
      transition: color 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }
    .ctrl-btn:hover { color: var(--text-main); transform: scale(1.05); }
    
    .ctrl-btn.play-pause {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--text-main);
      color: var(--text-main);
      background: transparent;
    }
    .ctrl-btn.play-pause:hover {
      background: var(--text-main);
      color: var(--bg-main);
    }

    /* =============================================
       FOOTER — 頁尾
       ============================================= */
    .footer {
      padding: 24px 40px 36px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-shrink: 0;
      border-top: 1px solid var(--border-thin);
    }
    .footer-left {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      line-height: 1;
      font-weight: 400;
    }
    .footer-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
    .footer-tagline {
      font-family: 'DM Mono', monospace;
      font-size: 8.5px;
      color: var(--text-sub);
      letter-spacing: 0.04em;
      font-style: italic;
      line-height: 1;
    }
    
    .footer-logo-img {
      height: 15px;
      width: auto;
      display: block;
      margin-bottom: 2px;
      object-fit: contain;
      flex-shrink: 0;
    }

    /* =============================================
       REVEAL OVERLAY
       ============================================= */
    .reveal-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-main);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .reveal-overlay.show { opacity: 1; pointer-events: all; }
    
    .reveal-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .reveal-line {
      width: 0;
      height: 1px;
      background: var(--text-main);
    }
    .reveal-overlay.show .reveal-line { animation: expandLine 1.8s ease forwards; }

    @keyframes expandLine {
      0% { width: 0; opacity: 0; }
      30% { opacity: 1; }
      100% { width: 100px; opacity: 0.6; }
    }

    .reveal-text {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--text-main);
    }
    .loading-dots span {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-main);
      display: inline-block;
      animation: dot 1.4s ease-in-out infinite;
      margin-left: 2px;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 0.8; transform: translateY(-2px); }
    }

    .fade-enter { animation: fadeUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .header { padding: 28px 24px 0; }
      .main { padding: 16px 24px; }
      .viewfinder-window { padding: 36px 20px; }
      .footer { padding: 16px 24px 28px; }
      .story-title { font-size: 19px; }
    }
  </style>
</head>

         Let's define the blank.

</div>

</div>

      series: "調色日子",

      src: "https://github.com/whatadayya/audiosnacks/raw/refs/heads/main/L-%E7%A8%B1%E4%B8%8D%E4%B8%8A%E6%84%9B%E6%83%85%E7%9A%84%E7%9B%B8%E9%81%87.m4a"
    }
    ,
    {
      id: 8,
      title: "領養貓咪",
      series: "屋內日子",
      duration: "3:07",
      durationSec: 235,
      src: "https://github.com/whatadayya/audiosnacks/raw/refs/heads/main/F-%E9%A0%98%E9%A4%8A%E8%B2%93%E5%92%AA.m4a"
    },
    {
      id: 9,
      title: "各種危機",
      series: "繁瑣日子",
      duration: "3:09",
      durationSec: 235,
      src: "https://github.com/whatadayya/audiosnacks/raw/refs/heads/main/F-%E5%90%84%E7%A8%AE%E5%8D%B1%E6%A9%9F.m4a"
    },
    {
      id: 10,
      title: "浪漫已成往事",
      series: "屋內日子",
      duration: "5:43",
      durationSec: 235,
      src: "https://github.com/whatadayya/audiosnacks/raw/refs/heads/main/D-%E6%B5%AA%E6%BC%AB%E5%B7%B2%E6%88%90%E5%BE%80%E4%BA%8B.m4a"
    }
  ];

  let currentStory = null;
  let isPlaying = false;
  let timer = null;
  let elapsed = 0;
  const audio = document.getElementById('audioPlayer');

  function applyAccentColor(series) {
    const color = seriesColors[series] || '#000000';
    document.documentElement.style.setProperty('--accent', color);
  }

  function randomStory() {
    return stories[Math.floor(Math.random() * stories.length)];
  }

  function formatTime(sec) {
    if (isNaN(sec) || sec < 0) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2,'0')}`;
  }

  function startPlay() {
    const overlay = document.getElementById('revealOverlay');
    overlay.classList.add('show');
    
    currentStory = randomStory();
    audio.src = currentStory.src;
    audio.load();

    setTimeout(() => {
      overlay.classList.remove('show');
      document.getElementById('stateBefore').style.display = 'none';
      
      const playingState = document.getElementById('statePlaying');
      playingState.style.display = 'flex';
      playingState.classList.add('fade-enter');

      document.getElementById('seriesTag').textContent = currentStory.series;
      document.getElementById('storyTitle').textContent = currentStory.title;
      document.getElementById('storyMeta').textContent = currentStory.duration;
      document.getElementById('totalTime').textContent = currentStory.duration;
      
      elapsed = 0;
      applyAccentColor(currentStory.series);

      audio.removeEventListener('timeupdate', updateFromAudio);
      audio.removeEventListener('ended', onEnded);
      audio.addEventListener('timeupdate', updateFromAudio);
      audio.addEventListener('ended', onEnded);

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          setPlayingUI(true);
        }).catch(error => {
          setPlayingUI(true);
          startMockTimer();
        });
      }
    }, 2400);
  }

  function startMockTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
      if (isPlaying) {
        elapsed++;
        if (elapsed >= currentStory.durationSec) {
          onEnded();
          return;
        }
        updateProgress(elapsed, currentStory.durationSec);
      }
    }, 1000);
  }

  function updateFromAudio() {
    if (audio.src) {
      updateProgress(audio.currentTime, audio.duration || currentStory.durationSec);
    }
  }

  function updateProgress(current, total) {
    const pct = (current / total) * 100;
    document.getElementById('progressFill').style.width = `${pct}%`;
    document.getElementById('currentTime').textContent = formatTime(current);
  }

  function togglePlay() {
    if (!currentStory) return;
    isPlaying = !isPlaying;

    if (audio.src && audio.readyState > 0) {
      isPlaying ? audio.play() : audio.pause();
    } else {
      if (isPlaying && !timer) startMockTimer();
    }
    setPlayingUI(isPlaying);
  }

  function setPlayingUI(playing) {
    isPlaying = playing;
    document.getElementById('playIcon').style.display = playing ? 'none' : 'block';
    document.getElementById('pauseIcon').style.display = playing ? 'block' : 'none';
    document.querySelectorAll('.wave-bar').forEach(b => b.style.animationPlayState = playing ? 'running' : 'paused');
  }

  function seekAudio(e) {
    const bar = document.getElementById('progressBar');
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;

    if (audio.src && !isNaN(audio.duration)) {
      audio.currentTime = pct * audio.duration;
    } else if (currentStory) {
      elapsed = Math.floor(pct * currentStory.durationSec);
      updateProgress(elapsed, currentStory.durationSec);
    }
  }

  function onEnded() {
    clearInterval(timer);
    timer = null;
    setPlayingUI(false);
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('currentTime').textContent = currentStory ? currentStory.duration : "0:00";
  }
</script>
